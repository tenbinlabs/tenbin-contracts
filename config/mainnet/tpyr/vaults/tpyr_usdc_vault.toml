# mainnet
[mainnet]
endpoint_url = "${MAINNET_RPC_URL}"

[mainnet.string]
name = "tPYR USDC Vault"
symbol = "tPYRv-USDC"
adapters = [                                                    # adapter config names, deployed in order
    "tpyr_usdc_market_adapter",
    "tpyr_usdc_aave_adapter",
    "tpyr_usdc_steakhousev2_adapter",
    "tpyr_usdc_spark_adapter",
]
liquidity_adapter = "tpyr_usdc_steakhousev2_adapter"              # must be a member of adapters
