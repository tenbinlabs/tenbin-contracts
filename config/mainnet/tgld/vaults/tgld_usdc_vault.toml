# mainnet
[mainnet]
endpoint_url = "${MAINNET_RPC_URL}"

[mainnet.string]
name = "tGLD USDC Vault"
symbol = "tGLDv-USDC"
adapters = [                                                    # adapter config names, deployed in order
    "tgld_usdc_market_adapter",
    "tgld_usdc_aave_adapter",
    "tgld_usdc_steakhousev2_adapter",
    "tgld_usdc_spark_adapter",
]
liquidity_adapter = "tgld_usdc_steakhousev2_adapter"              # must be a member of adapters
markets = ["tgld_stgld_usdc_market"]           # market config names the MARKET adapter allocates to

[mainnet.address]
allocator = "0x48Fa008bD2660974d55Ee9b7A9ECA1cE61347614"        # dev multisig
asset = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"            # usdc
curator = "0xE6Eb534f33A635e8d867414Af32F766D221F30d1"          # admin multisig
owner = "0x698c6d3726846C4AD4Dc9331862b92Cd80D2fb99"            # owner multisig
sentinel = "0x44C24D0937A829B3057be462b0e069516f1D9D45"         # gatekeeper key
manager = "0x42F3F01D45E67294e20cE98AcFDC24dD7EA75dEa"          # collateral manager contract

[mainnet.uint]
dead_deposit = 1_000000                         # 1 usdc
max_rate = 63419583967                          # 2000% APR
timelock_duration = 172800                      # 2 days

[mainnet.bool]
is_new_asset_vault = false                      # Whether this is a new asset vault
