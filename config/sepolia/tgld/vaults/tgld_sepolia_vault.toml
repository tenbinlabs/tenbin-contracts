# sepolia
[sepolia]
endpoint_url = "${SEPOLIA_RPC_URL}"

[sepolia.string]
name = "tGLD USDC Vault"
symbol = "tGLDv-USDC"
adapters = ["tgld_sepolia_usdc_market_adapter", "tgld_sepolia_usdc_aave_adapter", "tgld_sepolia_usdc_steakhousev2_adapter", "tgld_sepolia_usdc_spark_adapter"]
liquidity_adapter = "tgld_sepolia_usdc_steakhousev2_adapter"      # must be a member of adapters

markets = ["tgld_sepolia_stgld_usdc_market"]

[sepolia.address]
allocator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"        # owner key
asset = "0x847DB2D7c07dbA2bE28E9F236B74134d6897BB0A"            # set in deployment script
curator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"          # owner key
owner = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"            # owner key
sentinel = "0xF43ABe43FcC915db2F3bDB677690a29FD6ef930e"         # sepolia gatekeeper
manager = "0x2A3DECEe5f85104A165c522196b424516455228D" # existing collateral manager

[sepolia.uint]
dead_deposit = 1_000000                         # 1 usdc
max_rate = 63419583967                          # 2000% APR
timelock_duration = 0                           # no timelock on sepolia

[sepolia.bool]
is_new_asset_vault = false                      # Whether this is a new asset vault
