# mainnet
[sepolia]
endpoint_url = "${SEPOLIA_RPC_URL}"

[sepolia.string]
name = "tBRL USDC Vault"
symbol = "tBRLv-USDC"
adapters = ["tbrl_sepolia_usdc_market_adapter", "tbrl_sepolia_usdc_aave_adapter", "tbrl_sepolia_usdc_steakhousev2_adapter", "tbrl_sepolia_usdc_spark_adapter"]
liquidity_adapter = "tbrl_sepolia_usdc_steakhousev2_adapter"      # must be a member of adapters

markets = ["tbrl_sepolia_stbrl_usdc_market"]

[sepolia.address]
allocator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"        # owner key
asset = "0x847DB2D7c07dbA2bE28E9F236B74134d6897BB0A"            # set in deployment script
curator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"          # owner key
owner = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"            # owner key
sentinel = "0x26a8Fc58F43e6e591c4335e7d61C4f9A6cfdCEb3"         # sepolia gatekeeper
manager = "0x6Ecb1b938D027591ad4Fea0eeDe199C55d245FEb" # existing collateral manager

[sepolia.uint]
dead_deposit = 1_000000                         # 1 usdc
max_rate = 63419583967                          # 2000% APR
timelock_duration = 0                           # no timelock on sepolia

[sepolia.bool]
is_new_asset_vault = false                      # Whether this is a new asset vault
