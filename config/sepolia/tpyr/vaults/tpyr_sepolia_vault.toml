# sepolia
[sepolia]
endpoint_url = "${SEPOLIA_RPC_URL}"

[sepolia.string]
name = "tPYR USDC Vault"
symbol = "tPYRv-USDC"
adapters = ["tpyr_sepolia_usdc_market_adapter", "tpyr_sepolia_usdc_aave_adapter", "tpyr_sepolia_usdc_steakhousev2_adapter", "tpyr_sepolia_usdc_spark_adapter"]
liquidity_adapter = "tpyr_sepolia_usdc_steakhousev2_adapter"      # must be a member of adapters

markets = ["tpyr_sepolia_stpyr_usdc_market"]

[sepolia.address]
allocator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"        # owner key
asset = "0x847DB2D7c07dbA2bE28E9F236B74134d6897BB0A"            # set in deployment script
curator = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"          # owner key
owner = "0x794eBfe3B3C92409f72F569ADb3e44913a056a54"            # owner key
sentinel = "0xd1fb442aE62f0C829aa7f0946A173c39F9515213"
manager = "0xb5A35b1fcF046bA708186dfa306e8b15dc97C349" # Deployed collateral manager

[sepolia.uint]
dead_deposit = 1_000000                         # 1 usdc
max_rate = 63419583967                          # 2000% APR
timelock_duration = 0                           # no timelock on sepolia

[sepolia.bool]
is_new_asset_vault = false
